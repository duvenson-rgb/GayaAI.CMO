<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
body{margin:0}
.b{width:800px;height:200px;display:flex;align-items:center;justify-content:center}
.lk{display:flex;align-items:center;gap:14px}
.lk img{height:82px}
.h{font-family:var(--font-accent);font-weight:700;font-size:28px;line-height:1.35;color:var(--on-purple);letter-spacing:-.005em}
.url{position:absolute;right:112px;bottom:22px;display:flex;align-items:center;gap:6px;font-family:var(--font-accent);font-weight:700;font-size:17px;color:var(--on-purple-accent)}
.url svg{width:22px;height:22px}
</style>
</head>
<body>
<div class="b gaya-purple-stage gaya-purple-stage--glow">
<div class="lk"><img src="../assets/logo/gaya-isotype-color.svg" alt="GAYA"><div class="h">I refuse<br>to copy &amp; paste.</div></div>
<div class="url">Gaya.ai <i data-lucide="mouse-pointer-click"></i></div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
