<!-- @dsCard group="Type" viewport="700x300" name="Type Scale" subtitle="2xs → 6xl on a tuned major-third ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface-card); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 3px 0; }
  .r .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); width: 116px; flex: none; }
  .r .sample { font-family: var(--font-display); font-weight: 600; color: var(--text-primary); line-height: 1.1; white-space: nowrap; }
</style>
</head>
<body>
  <div class="r"><span class="tok">6xl · 72</span><span class="sample" style="font-size:var(--text-6xl)">Gaya</span></div>
  <div class="r"><span class="tok">4xl · 44</span><span class="sample" style="font-size:var(--text-4xl)">Quote faster</span></div>
  <div class="r"><span class="tok">3xl · 35</span><span class="sample" style="font-size:var(--text-3xl)">Super Paste</span></div>
  <div class="r"><span class="tok">2xl · 28</span><span class="sample" style="font-size:var(--text-2xl)">Section heading</span></div>
  <div class="r"><span class="tok">xl · 22</span><span class="sample" style="font-size:var(--text-xl)">Card title text</span></div>
  <div class="r"><span class="tok">lg · 18</span><span class="sample" style="font-size:var(--text-lg)">Lead paragraph</span></div>
  <div class="r"><span class="tok">base · 16</span><span class="sample" style="font-size:var(--text-base);font-family:var(--font-body)">Body copy default</span></div>
  <div class="r"><span class="tok">sm · 14</span><span class="sample" style="font-size:var(--text-sm);font-family:var(--font-body)">Secondary / labels</span></div>
  <div class="r"><span class="tok">xs · 12</span><span class="sample" style="font-size:var(--text-xs);font-family:var(--font-body)">Captions &amp; hints</span></div>
</body>
</html>
