<!-- @dsCard group="Brand" viewport="700x200" name="Isotype" subtitle="Bird-of-paradise G — the brand quartet in one mark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;padding:20px;background:var(--surface-card);display:flex;gap:28px;align-items:center}
.big{width:150px;height:150px;display:grid;place-items:center;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg)}
.big img{width:120px}
.col{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:14px;align-items:flex-end}
.tile{display:grid;place-items:center;border-radius:var(--radius-md)}
.k{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
.sw{display:flex;gap:6px;align-items:center}
.sw i{width:14px;height:14px;border-radius:3px;display:block}
</style>
</head>
<body>
<div class="big"><img src="../assets/logo/gaya-isotype-color.svg" alt="GAYA isotype"></div>
<div class="col">
<div class="row">
<div class="tile" style="width:64px;height:64px;background:#fff;border:1px solid var(--border-subtle)"><img src="../assets/logo/gaya-isotype-color.svg" style="width:48px" alt=""></div>
<div class="tile" style="width:64px;height:64px;background:var(--gaya-orange)"><img src="../assets/logo/gaya-isotype-white.svg" style="width:44px" alt=""></div>
<div class="tile" style="width:64px;height:64px;background:var(--neutral-900)"><img src="../assets/logo/gaya-isotype-color.svg" style="width:48px" alt=""></div>
<div class="tile" style="width:40px;height:40px;background:#fff;border:1px solid var(--border-subtle)"><img src="../assets/logo/gaya-isotype-color.svg" style="width:30px" alt=""></div>
<div class="tile" style="width:24px;height:24px;background:#fff;border:1px solid var(--border-subtle)"><img src="../assets/logo/gaya-isotype-color.svg" style="width:18px" alt=""></div>
</div>
<div class="sw"><i style="background:var(--gaya-orange)"></i><i style="background:var(--gaya-green)"></i><i style="background:var(--gaya-yellow)"></i><i style="background:var(--gaya-purple)"></i><span class="k">the leaves carry all four brand colors</span></div>
</div>
</body>
</html>
