<!-- @dsCard group="Type" viewport="700x180" name="Eyebrows & Data" subtitle="Montserrat caps eyebrows · JetBrains Mono for values" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .eyebrow { font-family: var(--font-accent); font-weight: 600; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-brand); }
  .subtitle { font-family: var(--font-accent); font-weight: 500; font-size: 17px; color: var(--text-secondary); margin-top: 6px; }
  .data { font-family: var(--font-mono); margin-top: 18px; display: flex; gap: 22px; }
  .data div { font-size: 15px; color: var(--text-primary); }
  .data .k { font-size: 10px; color: var(--text-muted); display: block; letter-spacing: .04em; text-transform: uppercase; margin-bottom: 3px; font-family: var(--font-accent); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 18px; }
</style>
</head>
<body>
  <div class="eyebrow">Workflow &amp; Productivity</div>
  <div class="subtitle">The secondary voice — calm, modern, familiar.</div>
  <div class="data">
    <div><span class="k">Policy</span>HO-4821-22</div>
    <div><span class="k">Premium</span>$1,240.00</div>
    <div><span class="k">Effective</span>2026-07-01</div>
  </div>
  <div class="meta">Montserrat 600 caps +0.18em · JetBrains Mono for data values only</div>
</body>
</html>
