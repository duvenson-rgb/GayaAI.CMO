<!-- @dsCard group="Colors" viewport="700x170" name="Purple Stage Tokens" subtitle="Alternate bold background — white type, orange accents" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
body{margin:0;padding:20px;background:var(--surface-card)}
.g{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:10px}
.s{height:92px;border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-subtle)}
.n{font-family:var(--font-accent);font-weight:700;font-size:12px;margin-bottom:2px}
</style>
</head>
<body>
<div class="g">
<div class="s" style="background:var(--surface-purple);color:var(--on-purple)"><span class="n">--surface-purple</span>#521184 · flat stage</div>
<div class="s" style="background:var(--surface-purple);color:var(--on-purple)"><span class="n" style="color:var(--on-purple)">--on-purple</span>white · headlines</div>
<div class="s" style="background:var(--surface-purple);color:var(--on-purple-accent)"><span class="n">--on-purple-accent</span>orange · CTA / URL</div>
<div class="s" style="background:linear-gradient(135deg,var(--glow-lavender),var(--glow-rose),var(--orange-400));color:var(--purple-800)"><span class="n">glow</span>lavender · rose · orange</div>
</div>
</body>
</html>
