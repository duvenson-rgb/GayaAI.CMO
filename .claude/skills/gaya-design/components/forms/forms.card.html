<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; align-items: start; }
  .switches { display: flex; flex-direction: column; gap: 14px; grid-column: 1 / -1; }

<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Input, Switch } = window.GAYADesignSystem_f55ce3;
    function Demo() {
      return (
        <div className="grid">
          <Input label="Policy number" placeholder="HO-4821" required />
          <Input label="Premium" leadingAffix={<i data-lucide="dollar-sign"></i>} defaultValue="1,240.00" />
          <Input label="Search carriers" trailingAffix={<i data-lucide="search"></i>} placeholder="Progressive…" />

          <div className="switches">
            <Switch label="Auto-fill carrier portals" defaultChecked />
            <Switch label="Notify on quote complete" />
            <Switch label="Disabled option" disabled />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    requestAnimationFrame(() => lucide.createIcons());
  </script>
