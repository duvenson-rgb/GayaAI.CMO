<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; align-items: start; }
  .badges { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .avs { display: flex; gap: 12px; align-items: center; }
  .ct { font-family: var(--font-display); font-weight: 700; font-size: 18px; color: var(--text-primary); }
  .cs { font-family: var(--font-body); font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Card, Badge, Avatar } = window.GAYADesignSystem_f55ce3;
    function Demo() {
      return (
        <div className="grid">
          <Card padding="md" interactive>
            <div className="badges"><Badge color="green" dot>Synced</Badge><Badge color="orange">Beta</Badge></div>
            <div className="ct">Home + Auto bundle</div>
            <div className="cs">Quoted across 8 carriers in 4m 12s.</div>
          </Card>
          <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
            <div className="badges">
              <Badge color="solid">Solid</Badge>
              <Badge color="neutral">Neutral</Badge>
              <Badge color="purple">Purple</Badge>
              <Badge color="outline">Outline</Badge>
            </div>
            <div className="avs">
              <Avatar name="Carl Ziadé" size="sm" />
              <Avatar name="Jean Pierre" size="md" />
              <Avatar name="Sam Lee" size="lg" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
  </script>
</body>
</html>
