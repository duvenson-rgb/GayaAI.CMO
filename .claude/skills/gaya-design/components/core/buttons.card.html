<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  [data-lucide] { width: 16px; height: 16px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { Button, IconButton } = window.GAYADesignSystem_f55ce3;
    const Ico = (n) => <i data-lucide={n}></i>;
    function Demo() {
      return (
        <div className="stack">
          <div className="row">
            <Button variant="primary" leadingIcon={Ico("copy")}>Super Copy</Button>
            <Button variant="secondary">Secondary</Button>
            <Button variant="ghost">Ghost</Button>
            <Button variant="brandtint">Brand tint</Button>
            <Button variant="danger">Delete</Button>
          </div>
          <div className="row">
            <Button size="sm">Small</Button>
            <Button size="md">Medium</Button>
            <Button size="lg" trailingIcon={Ico("arrow-right")}>Large</Button>
            <Button disabled>Disabled</Button>
          </div>
          <div className="row">
            <IconButton aria-label="Copy"><i data-lucide="clipboard"></i></IconButton>
            <IconButton aria-label="Settings"><i data-lucide="settings"></i></IconButton>
            <IconButton aria-label="More"><i data-lucide="ellipsis"></i></IconButton>
            <Button variant="primary" size="lg" leadingIcon={Ico("clipboard-paste")}>Super Paste</Button>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
    requestAnimationFrame(() => lucide.createIcons());
  </script>
</body>
</html>
