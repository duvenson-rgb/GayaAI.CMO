<!DOCTYPE html>
<!-- engine_brand.html — "personalbrandlaunch" style, recolored to the user's brand #0abbc2.
Transparent overlay frames over NATURAL (ungraded or lightly graded) footage; full-screen brand-color inserts are opaque.
Data-driven: per video only EVENTS changes (define window.EVENTS in events.js next to this file, or edit DEMO below).
Needs fonts/Montserrat-Variable.ttf next to it.
Event types (all take t0, t1 in seconds):
  sandwich {pre, key, post}            small white lead-in, huge brand keyword, small trailing words
  caption  {text}                      white caption; wrap words in **..** for the bold keyword
  insert   {header, sub, cards:[{title, lines:[..]}], cols}   full-screen brand background (opaque)
  pill     {text, y}                   white label pill with ink text (captions on inserts)
  doc      {text, y}                   white paper card, text types on
  timeline {segments:[{label, color, w}], legend:bool, active:index, y}
  label    {text, x, y, arrow:"down-left"|"up"|null}
  comment  {user, text}                comment card, text types on
Palette: edit the :root tokens only.
FACE SAFETY (user rule: animations never cover the face):
  load faces.js (scripts/face_track.py on the footage exactly as it sits under the overlays). At load, planLayout():
  - captions/pills that touch the face move down below the chin (kept above y=1650);
  - any other graphic that touches the face, or a caption that cannot move far enough, turns its whole event window into SPLIT:
    top half (0-960) = dark panel with the graphics fitted inside + captions near its bottom; bottom half = footage reframed on the head.
  - full-screen inserts are cutaways (face not visible) and are left alone.
  window.PLAN.splits = [{t0,t1,y0}] -> scripts/split_composite.py reframes the footage (crop 1080x960 at y0, placed at y=960). -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(fonts/Montserrat-Variable.ttf);font-weight:100 900}
:root{
  --brand:#0abbc2;        /* primary (replaces the reference lime #c8fa00) */
  --brand-light:#7fe4e8;  /* tint: glows, subtle fills */
  --brand-deep:#067e83;   /* shade: borders, pressed states */
  --ink:#04191a;          /* text on brand backgrounds (contrast 8.9:1) */
  --accent:#ff6b5b;       /* complementary coral: send button, alerts, 1st timeline segment */
  --amber:#ffb347;        /* split-complement: warm segment */
  --violet:#8b7bff;       /* segment variety */
  --blue:#3d7bff;         /* segment variety */
  --paper:#ffffff;
}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:M}
.abs{position:absolute}
.hide{display:none}
/* sandwich caption */
.sw{position:absolute;left:0;right:0;text-align:center}
.sw .pre,.sw .post{font-weight:600;font-size:50px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.sw .pre{display:block;text-align:left;margin-left:120px;margin-bottom:-18px}
.sw .post{display:block;text-align:right;margin-right:120px;margin-top:-10px}
.sw .key{display:block;font-weight:900;font-size:180px;line-height:.9;letter-spacing:-3px;color:var(--brand);white-space:nowrap;
  text-shadow:0 5px 22px rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.25)}
.cap{position:absolute;left:40px;right:40px;text-align:center;font-weight:500;font-size:54px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.cap b{font-weight:800}
/* insert */
.ins{position:absolute;inset:0;background:var(--brand);display:flex;flex-direction:column;align-items:center;padding-top:300px;box-sizing:border-box}
.ins h2{margin:0;font-weight:900;font-size:66px;color:var(--ink);letter-spacing:-.5px;text-transform:uppercase}
.ins .sub{font-weight:500;font-size:30px;color:var(--ink);opacity:.8;margin:8px 80px 40px;text-align:center;line-height:1.3}
.ins .grid{display:grid;gap:34px;width:900px}
.card{background:var(--paper);border-radius:6px;box-shadow:0 14px 30px rgba(0,40,42,.28);padding:26px 30px;box-sizing:border-box}
.card h3{margin:0 0 12px;font-size:30px;font-weight:800;color:#111}
.card p{margin:0 0 8px;font-size:22px;color:#444;line-height:1.35}
.pill{position:absolute;left:0;right:0;text-align:center}
.pill span{display:inline-block;background:#fff;color:#111;font-weight:800;font-size:46px;padding:10px 22px;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
/* doc */
.doc{position:absolute;left:100px;width:620px;background:var(--paper);padding:34px 36px;box-sizing:border-box;box-shadow:0 18px 40px rgba(0,0,0,.3);font-size:25px;line-height:1.45;color:#111;min-height:380px}
.caret{display:inline-block;width:3px;height:26px;background:#111;vertical-align:-4px;margin-left:2px}
/* timeline */
.tl{position:absolute;left:110px;width:860px;height:60px}
.seg{position:absolute;top:24px;height:10px;border-radius:5px}
.tick{position:absolute;top:6px;width:8px;height:46px;border-radius:4px}
.legend{position:absolute;left:250px}
.legend div{display:flex;align-items:center;gap:18px;font-weight:700;font-size:34px;color:#fff;margin:14px 0;text-shadow:0 2px 8px rgba(0,0,0,.45)}
.legend i{width:30px;height:30px;border-radius:50%;display:inline-block;box-shadow:0 0 12px rgba(255,255,255,.4)}
/* label */
.lab{position:absolute;background:#fff;color:#111;font-weight:800;font-size:40px;padding:8px 18px;border-radius:6px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
/* comment */
.com{position:absolute;left:110px;width:860px;background:#fff;border:6px solid var(--brand);border-radius:22px;padding:18px 24px;box-sizing:border-box;display:flex;align-items:center;gap:22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.com .av{width:74px;height:74px;border-radius:50%;background:linear-gradient(135deg,var(--brand-light),var(--brand-deep));flex:none}
.com .u{font-size:26px;font-weight:600;color:#666}.com .t{font-size:38px;font-weight:800;color:#111}
.com .send{margin-left:auto;width:64px;height:64px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
#panel{position:absolute;left:0;top:0;width:1080px;height:960px;background:linear-gradient(180deg,#0e2224 0%,#04191a 100%);display:none}
#panel:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--brand)}
#ov{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0}
</style></head><body><div id="stage"><div id="panel"></div><div id="ov"></div><div id="capL"></div><div id="insL"></div></div>
<script src="events.js" onerror="0"></script>
<script src="faces.js" onerror="0"></script>
<script>
const DEMO=[
 {type:"doc",t0:0,t1:2,y:150,text:"Èske w konn ekri yon script ki sanble li an dezòd? Se paske li pa gen yon estrikti. Chak videyo viral gen yon hook, yon valè ak yon CTA."},
 {type:"sandwich",t0:0,t1:2,pre:"èske w konn",key:"EKRI",post:"yon script"},
 {type:"timeline",t0:2,t1:4,y:330,active:-1,legend:true,segments:[
   {label:"Hook (0-3)",color:"var(--accent)",w:.18},{label:"Otorite (3-5)",color:"var(--violet)",w:.12},
   {label:"Valè (5-30)",color:"var(--brand)",w:.42},{label:"Rezilta (30-35)",color:"var(--amber)",w:.14},{label:"CTA (35-40)",color:"var(--blue)",w:.14}]},
 {type:"sandwich",t0:2,t1:4,pre:"",key:"ESTRIKTI",post:""},
 {type:"insert",t0:4,t1:6,header:"Estrikti viral",sub:"Hook → Valè → Rezilta → CTA",cols:2,cards:[
   {title:"Edikasyon",lines:["Hook: di yo sa y ap aprann","Valè: 3 etap klè","CTA: kòmante yon mo"]},
   {title:"Istwa",lines:["Hook: moman pwoblèm nan","Vire: sa ki chanje","CTA: swiv pou pati 2"]}]},
 {type:"pill",t0:4,t1:6,text:"fè l tounen yon modèl",y:1420},
 {type:"timeline",t0:6,t1:8,y:330,active:0,legend:false,segments:[
   {label:"Hook",color:"var(--accent)",w:.18},{label:"",color:"var(--violet)",w:.12},{label:"",color:"var(--brand)",w:.42},{label:"",color:"var(--amber)",w:.14},{label:"",color:"var(--blue)",w:.14}]},
 {type:"label",t0:6,t1:8,text:"HOOK",x:120,y:470,arrow:"up"},
 {type:"sandwich",t0:6,t1:8,pre:"gen yon",key:"HOOK",post:""},
 {type:"caption",t0:8,t1:10,text:"annik **kòmante** yon mo",y:1150},
 {type:"comment",t0:8,t1:10,user:"123viral",text:"ESTRIKTI",y:1250},
];
const EVENTS=window.EVENTS||DEMO;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), eob=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}, eo=x=>1-Math.pow(1-cl(x),3);
const st=document.getElementById('stage');
const md=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
EVENTS.forEach((e,i)=>{const el=document.createElement('div');el.className='hide';e.el=el;
  if(e.type==='sandwich'){el.innerHTML=`<div class="sw" style="top:${e.y||1080}px">${e.pre?`<span class="pre">${e.pre}</span>`:''}<span class="key">${e.key}</span>${e.post?`<span class="post">${e.post}</span>`:''}</div>`;}
  if(e.type==='caption'){el.innerHTML=`<div class="cap" style="top:${e.y||1180}px">${md(e.text)}</div>`;}
  if(e.type==='insert'){el.innerHTML=`<div class="ins"><h2>${e.header}</h2>${e.sub?`<div class="sub">${e.sub}</div>`:''}<div class="grid" style="grid-template-columns:repeat(${e.cols||1},1fr)">${(e.cards||[]).map(c=>`<div class="card"><h3>${c.title}</h3>${c.lines.map(l=>`<p>${l}</p>`).join('')}</div>`).join('')}</div></div>`;}
  if(e.type==='pill'){el.innerHTML=`<div class="pill" style="top:${e.y||1340}px"><span>${e.text}</span></div>`;}
  if(e.type==='doc'){el.innerHTML=`<div class="doc" style="top:${e.y||150}px"><span class="txt"></span><span class="caret"></span></div>`;}
  if(e.type==='timeline'){let x=0,h='';const W=860;e.segments.forEach((s,k)=>{h+=`<div class="seg" data-k="${k}" style="left:${x*W}px;width:${s.w*W}px;background:${s.color}"></div>`;
      const n=Math.max(1,Math.round(s.w*10));for(let j=0;j<=n;j++)h+=`<div class="tick" data-k="${k}" style="left:${(x+s.w*j/n)*W-4}px;background:${s.color}"></div>`;x+=s.w;});
    const lg=e.legend?`<div class="legend" style="top:${(e.y||330)+110}px">${e.segments.map((s,k)=>`<div data-k="${k}"><i style="background:${s.color}"></i>${s.label}</div>`).join('')}</div>`:'';
    el.innerHTML=`<div class="tl" style="top:${e.y||330}px">${h}</div>${lg}`;}
  if(e.type==='label'){const arr=e.arrow==='up'?`<svg class="abs" style="left:${e.x+30}px;top:${e.y-120}px" width="90" height="110" viewBox="0 0 90 110"><path d="M60 100 C20 80 15 45 30 12" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M14 30 L30 8 L46 30" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`:'';
    el.innerHTML=`${arr}<div class="lab" style="left:${e.x}px;top:${e.y}px">${e.text}</div>`;}
  if(e.type==='comment'){el.innerHTML=`<div class="com" style="top:${e.y||1250}px"><div class="av"></div><div><div class="u">${e.user}</div><div class="t"><span class="txt"></span><span class="caret" style="height:34px"></span></div></div><div class="send"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>`;}
  const layer=e.type==='insert'?'insL':(['sandwich','caption','pill'].includes(e.type)?'capL':'ov');
  e.capLike=layer==='capL'; e.dy=0; document.getElementById(layer).appendChild(el);});
const FACES=window.FACES||null, SAFE_BOTTOM=1650, MARGIN=30;
function faceAt(t){if(!FACES)return null;const b=FACES.boxes[Math.max(0,Math.min(FACES.boxes.length-1,Math.round(t*FACES.fps)))];return {l:b[0]-MARGIN,t:b[1]-MARGIN,r:b[0]+b[2]+MARGIN,b:b[1]+b[3]+MARGIN};}
const hit=(a,f)=>f&&a.width>0&&a.left<f.r&&a.right>f.l&&a.top<f.b&&a.bottom>f.t;
function rectOf(e){const rs=[...e.el.querySelectorAll('*')].map(n=>n.getBoundingClientRect()).filter(r=>r.width>0&&r.height>0);
  if(!rs.length)return {width:0};const l=Math.min(...rs.map(r=>r.left)),t=Math.min(...rs.map(r=>r.top)),r=Math.max(...rs.map(r=>r.right)),b=Math.max(...rs.map(r=>r.bottom));return {left:l,top:t,right:r,bottom:b,width:r-l,height:b-t};}
let PLAN={splits:[]};
function splitAt(t){return PLAN.splits.find(s=>t>=s.t0&&t<s.t1)||null;}
function planLayout(){
  if(!FACES){window.PLAN=PLAN;return;}
  const samples=e=>{const a=[];for(let t=e.t0+.35;t<e.t1-.02;t+=.2)a.push(t);return a.length?a:[(e.t0+e.t1)/2];};
  EVENTS.filter(e=>e.type!=='insert').forEach(e=>{e.split=false;
    for(const t of samples(e)){render(t,true);const r=rectOf(e),f=faceAt(t);if(!hit(r,f))continue;
      if(e.capLike){const need=f.b+MARGIN-r.top;if(r.bottom+need<=SAFE_BOTTOM){e.dy+=need;continue;}}
      e.split=true;break;}});
  // re-check moved captions, then build split windows (merge gaps < .6s)
  EVENTS.filter(e=>e.capLike&&e.dy&&!e.split).forEach(e=>{for(const t of samples(e)){render(t,true);if(hit(rectOf(e),faceAt(t))){e.split=true;e.dy=0;break;}}});
  let w=EVENTS.filter(e=>e.split).map(e=>[e.t0,e.t1]).sort((a,b)=>a[0]-b[0]),m=[];
  w.forEach(x=>{if(m.length&&x[0]-m[m.length-1][1]<.6)m[m.length-1][1]=Math.max(m[m.length-1][1],x[1]);else m.push([...x]);});
  // drop splits that fall entirely inside a full-screen insert
  const ins=EVENTS.filter(e=>e.type==='insert'); m=m.filter(([a,b])=>!ins.some(i=>a>=i.t0&&b<=i.t1));
  PLAN.splits=m.map(([a,b])=>{const tops=[];for(let t=a;t<b;t+=1/FACES.fps)tops.push(faceAt(t).t+MARGIN);tops.sort((x,y)=>x-y);
    const y0=Math.round(Math.max(0,Math.min(960,tops[tops.length>>1]-60)));
    // fit the graphics of this window into the top panel (60..700), from their largest extent
    let U=null;for(let t=a+.35;t<b;t+=.2){render(t,true,true);EVENTS.filter(e=>!e.capLike&&e.type!=='insert'&&t>=e.t0&&t<e.t1).forEach(e=>{const r=rectOf(e);if(!r.width)return;
      U=U?{l:Math.min(U.l,r.left),t:Math.min(U.t,r.top),r:Math.max(U.r,r.right),b:Math.max(U.b,r.bottom)}:{l:r.left,t:r.top,r:r.right,b:r.bottom};});}
    let fit=null;if(U){const sc=Math.min(1,960/(U.r-U.l),640/(U.b-U.t));fit={sc,tx:540-sc*(U.l+U.r)/2,ty:380-sc*(U.t+U.b)/2};}
    return {t0:+a.toFixed(3),t1:+b.toFixed(3),y0,fit};});
  window.PLAN=PLAN;}
function render(t,planning=false,raw=false){
  const sp=planning?null:splitAt(t);
  document.getElementById('panel').style.display=sp?'block':'none';
  document.getElementById('ov').style.transform=(sp&&sp.fit&&!raw)?`translate(${sp.fit.tx}px,${sp.fit.ty}px) scale(${sp.fit.sc})`:'none';
  EVENTS.forEach(e=>{const on=t>=e.t0&&t<e.t1;e.el.className=on?'':'hide';if(!on)return;const dt=t-e.t0,el=e.el.firstElementChild;
    if(e.capLike){if(e.top0===undefined)e.top0=parseFloat(el.style.top)||0;
      if(sp){el.style.top='0px';const h=el.offsetHeight;el.style.top=(820-h/2)+'px';} else el.style.top=(e.top0+e.dy)+'px';}
    if(e.type==='sandwich'){const k=el.querySelector('.key');k.style.transform=`scale(${.7+.3*eob(dt/.22)})`;k.style.opacity=cl(dt/.06);
      el.querySelectorAll('.pre,.post').forEach((s,j)=>{s.style.opacity=cl((dt-.05-j*.08)/.12);s.style.transform=`translateY(${(1-eo((dt-.05-j*.08)/.2))*16}px)`;});
      const w=k.scrollWidth;k.style.fontSize=(w>940?180*940/w:180)+'px';}
    if(e.type==='caption'||e.type==='pill'){el.style.opacity=cl(dt/.08);el.style.transform=`scale(${.85+.15*eob(dt/.18)})`;}
    if(e.type==='insert'){el.style.clipPath=`circle(${eo(dt/.3)*140}% at 50% 50%)`;
      el.querySelectorAll('.card').forEach((c,j)=>{const p=eob((dt-.15-j*.12)/.35);c.style.opacity=cl((dt-.15-j*.12)/.1);c.style.transform=`translateY(${(1-p)*60}px)`;});}
    if(e.type==='doc'||e.type==='comment'){const n=Math.floor(Math.max(0,dt-.15)*(e.type==='doc'?60:10));e.el.querySelector('.txt').textContent=e.text.slice(0,n);
      e.el.querySelector('.caret').style.opacity=(Math.floor(t*3)%2)?0:1;el.style.opacity=cl(dt/.12);el.style.transform=`translateY(${(1-eob(dt/.3))*-40}px)`;}
    if(e.type==='timeline'){const p=eo(dt/.5);e.el.querySelectorAll('.seg,.tick').forEach(s=>{const k=+s.dataset.k;s.style.opacity=cl(p*e.segments.length-k)*(e.active>=0&&k!==e.active?.35:1);});
      e.el.querySelectorAll('.legend div').forEach((d,k)=>{d.style.opacity=cl((dt-.3-k*.1)/.15);d.style.transform=`translateX(${(1-eo((dt-.3-k*.1)/.25))*-30}px)`;});}
    if(e.type==='label'){e.el.style.opacity=cl((dt-.1)/.1);e.el.style.transform=`scale(${.8+.2*eob((dt-.1)/.25)})`;e.el.style.transformOrigin=`${e.x}px ${e.y}px`;}
  });}
planLayout();
window.render=render;
</script></body></html>
